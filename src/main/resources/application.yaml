shelvie:
  security:
    mode: none          # Options: none | basic | jwt

    # ── Basic Authentication ──────────────────────────────────────────────────
    # mode: basic
    # basic:
    #   username: admin
    #   password: changeme

    # ── JWT Authentication ────────────────────────────────────────────────────
    # mode: jwt
    # jwt:
    #   secret: your-very-long-256-bit-secret-key-change-this-in-production
    #   expiration-ms: 86400000   # 24 hours

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:shelviedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true